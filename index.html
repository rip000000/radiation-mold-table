<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>放疗患者模具拆除统计表</title>
  <style>
    * {box-sizing: border-box;font-family: system-ui, -apple-system, sans-serif;margin:0;padding:0;}
    body {background:#f5f7fa;padding:12px;font-size:14px;}
    .container {max-width:900px;margin:0 auto;background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px #0002;}
    .tab-wrap {display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
    .tab-btn {padding:8px 14px;border:none;border-radius:6px;background:#e8edf5;color:#333;cursor:pointer;font-size:14px;}
    .tab-btn.active {background:#2b6cb0;color:#fff;}
    .panel {display:none;}
    .panel.active {display:block;}
    .form-row {margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    label {font-weight:500;min-width:70px;}
    input, select {padding:7px 8px;border:1px solid #ccc;border-radius:6px;font-size:14px;flex:1;min-width:120px;}
    button {padding:7px 12px;border:none;border-radius:6px;cursor:pointer;font-size:14px;background:#2b6cb0;color:#fff;}
    button:disabled {background:#b9c8dd;cursor:not-allowed;}
    table {width:100%;border-collapse:collapse;margin:12px 0;}
    th,td {border:1px solid #e2e8f0;padding:9px 6px;text-align:center;}
    th {background:#edf2f7;}
    .badge-photon {background:#c6f6d5;color:#22543d;padding:2px 6px;border-radius:4px;font-size:12px;}
    .badge-heavy {background:#fed7d7;color:#742a2a;padding:2px 6px;border-radius:4px;font-size:12px;}
    .status-wait {color:#718096;}
    .status-doc {color:#d69e2e;}
    .status-tech {color:#3182ce;}
    .status-arch {color:#38a169;}
    .tip {padding:8px;background:#e6fffa;border-radius:6px;margin:10px 0;color:#234e52;font-size:13px;}
    .custom-check{
      width:20px;height:20px;border:1px solid #666;border-radius:3px;
      display:inline-flex;align-items:center;justify-content:center;
      cursor:pointer;font-size:16px;color:#2b6cb0;
      touch-action: manipulation;
      user-select:none;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 style="text-align:center;margin-bottom:16px">放疗患者模具拆除统计表</h2>
  <div class="tab-wrap">
    <button class="tab-btn active" data-tab="doctor">医生工作台</button>
    <button class="tab-btn" data-tab="tech">技师工作台</button>
    <button class="tab-btn" data-tab="archive">归档记录</button>
  </div>

  <div class="panel active" id="panel-doctor">
    <div class="tip">每周三09:00发布；点击方框勾选患者，点击本行【确认拆除】提交</div>
    <div class="form-row">
      <label>选择科室：</label>
      <select id="doc-dept">
        <option value="放疗一科">放疗一科</option>
        <option value="放疗二科">放疗二科</option>
        <option value="放疗三科">放疗三科</option>
        <option value="放疗四科">放疗四科</option>
        <option value="放疗五科">放疗五科</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>选择</th>
          <th>姓名</th>
          <th>体位</th>
          <th>模具类型</th>
          <th>治疗类型</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="doc-table-body"></tbody>
    </table>
  </div>

  <div class="panel" id="panel-tech">
    <div class="tip">技师录入患者；医生提交后，在此确认执行拆除，确认后自动归档并从当前列表隐藏</div>
    <div class="form-row">
      <label>科室</label>
      <select id="tech-dept">
        <option>放疗一科</option>
        <option>放疗二科</option>
        <option>放疗三科</option>
        <option>放疗四科</option>
        <option>放疗五科</option>
      </select>
    </div>
    <div class="form-row">
      <label>患者姓名</label><input id="tech-name" placeholder="输入姓名">
    </div>
    <div class="form-row">
      <label>体位</label>
      <select id="tech-pos">
        <option>仰卧</option>
        <option>俯卧</option>
      </select>
    </div>
    <div class="form-row">
      <label>模具类型</label>
      <select id="tech-mold">
        <option>头模</option>
        <option>体膜</option>
      </select>
    </div>
    <div class="form-row">
      <label>治疗类型</label>
      <select id="tech-therapy">
        <option>光子</option>
        <option>重离子</option>
      </select>
    </div>
    <div class="form-row">
      <button onclick="addPatient()">新增患者</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>科室</th>
          <th>姓名</th>
          <th>体位</th>
          <th>模具类型</th>
          <th>治疗类型</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tech-table-body"></tbody>
    </table>
  </div>

  <div class="panel" id="panel-archive">
    <div class="tip">已完成拆除归档患者记录，仅查看</div>
    <table>
      <thead>
        <tr>
          <th>科室</th>
          <th>姓名</th>
          <th>体位</th>
          <th>模具类型</th>
          <th>治疗类型</th>
          <th>归档时间</th>
        </tr>
      </thead>
      <tbody id="archive-table-body"></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = "/api";
const STATUS = {
  WAIT: "待勾选",
  DOC_CONFIRM: "待技师执行",
  ARCHIVE: "已归档"
};
let patientList = [];
let archiveList = [];

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.onclick = async ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
    await fetchAllData();
  }
})

async function fetchAllData(){
  const res = await fetch(`${API_BASE}/list`);
  const json = await res.json();
  patientList = json.patientList;
  archiveList = json.archiveList;
  renderAll();
}

async function addPatient(){
  const dept = document.getElementById("tech-dept").value;
  const name = document.getElementById("tech-name").value.trim();
  const pos = document.getElementById("tech-pos").value;
  const mold = document.getElementById("tech-mold").value;
  const therapy = document.getElementById("tech-therapy").value;
  if(!name){alert("请输入患者姓名");return;}
  await fetch(`${API_BASE}/add`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({dept,name,pos,mold,therapy})
  })
  document.getElementById("tech-name").value = "";
  await fetchAllData();
}

async function toggleCheck(pid){
  await fetch(`${API_BASE}/toggle-check`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({pid})
  })
  await fetchAllData();
}

async function docConfirm(pid){
  await fetch(`${API_BASE}/doc-confirm`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({pid})
  })
  await fetchAllData();
  alert("已提交，待技师执行");
}

async function techConfirm(pid){
  await fetch(`${API_BASE}/tech-archive`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({pid})
  })
  await fetchAllData();
  alert("已执行拆除，完成归档");
}

function renderAll(){
  renderDoctorTable();
  renderTechTable();
  renderArchiveTable();
}

function renderDoctorTable(){
  const selDept = document.getElementById("doc-dept").value;
  const tbody = document.getElementById("doc-table-body");
  tbody.innerHTML = "";
  const list = patientList.filter(p=>p.dept === selDept && p.status !== STATUS.ARCHIVE);
  list.forEach(p=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><div class="custom-check" data-pid="${p.id}">${p.checked?"✓":""}</div></td>
      <td>${p.name}</td>
      <td>${p.pos}</td>
      <td>${p.mold}</td>
      <td><span class="${p.therapy==='光子'?'badge-photon':'badge-heavy'}">${p.therapy}</span></td>
      <td class="${p.status===STATUS.WAIT?'status-wait':'status-doc'}">${p.status}</td>
      <td><button data-pid="${p.id}" ${!p.checked ? "disabled":""}>确认拆除</button></td>
    `;
    tbody.appendChild(tr);
  })
}

const docTableBody = document.getElementById("doc-table-body");
function handleTableEvent(e){
  const target = e.target;
  if(target.classList.contains("custom-check")){
    const pid = target.dataset.pid;
    toggleCheck(pid);
  }else if(target.tagName === "BUTTON" && target.dataset.pid){
    const pid = target.dataset.pid;
    docConfirm(pid);
  }
}
docTableBody.addEventListener("click", handleTableEvent);
docTableBody.addEventListener("touchend", handleTableEvent);

function renderTechTable(){
  const tbody = document.getElementById("tech-table-body");
  tbody.innerHTML = "";
  patientList.forEach(p=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.dept}</td>
      <td>${p.name}</td>
      <td>${p.pos}</td>
      <td>${p.mold}</td>
      <td><span class="${p.therapy==='光子'?'badge-photon':'badge-heavy'}">${p.therapy}</span></td>
      <td class="${p.status===STATUS.WAIT?'status-wait':'status-doc'}">${p.status}</td>
      <td>${p.status===STATUS.DOC_CONFIRM?`<button onclick="techConfirm('${p.id}')">确认执行拆除</button>`:"-"}</td>
    `;
    tbody.appendChild(tr);
  })
}

function renderArchiveTable(){
  const tbody = document.getElementById("archive-table-body");
  tbody.innerHTML = "";
  archiveList.forEach(p=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${p.dept}</td>
      <td>${p.name}</td>
      <td>${p.pos}</td>
      <td>${p.mold}</td>
      <td><span class="${p.therapy==='光子'?'badge-photon':'badge-heavy'}">${p.therapy}</span></td>
      <td>${p.archiveTime}</td>
    `;
    tbody.appendChild(tr);
  })
}

document.getElementById("doc-dept").addEventListener("change",fetchAllData);
fetchAllData();
</script>
</body>
</html>
