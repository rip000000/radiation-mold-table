<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>放疗患者模具拆除统计表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{padding:12px;background:#f5f7fa}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #ddd}
select,button{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#2563eb;color:white;border:none}
button:disabled{background:#aaa}
.item{display:flex;align-items:center;padding:10px;border-bottom:1px solid #eee;gap:8px}
.checkbox{width:22px;height:22px;border:1px solid #666;border-radius:4px;display:grid;place-items:center;cursor:pointer}
.checkbox.checked{background:#2563eb}
.checkbox.checked::after{content:"✓";color:#fff}
.info{flex:1}
.label{font-size:14px;color:#555}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{flex:1;padding:10px;text-align:center;background:#e2e8f0;border-radius:8px;cursor:pointer}
.tab.active{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="tabs">
  <div class="tab active" data-tab="doctor">医生工作台</div>
  <div class="tab" data-tab="tech">技师工作台</div>
</div>

<!-- 医生工作台 -->
<div id="tab-doctor" class="tab-content">
  <div class="card">
    <h3>选择科室</h3>
    <select id="deptSelect">
      <option value="放疗一科">放疗一科</option>
      <option value="放疗二科">放疗二科</option>
      <option value="放疗三科">放疗三科</option>
      <option value="放疗四科">放疗四科</option>
      <option value="放疗五科">放疗五科</option>
    </select>
    <div id="patientListDoctor"></div>
  </div>
</div>

<!-- 技师工作台 -->
<div id="tab-tech" class="tab-content" style="display:none">
  <div class="card">
    <h3>录入/编辑患者</h3>
    <select id="techDept">
      <option value="放疗一科">放疗一科</option>
      <option value="放疗二科">放疗二科</option>
      <option value="放疗三科">放疗三科</option>
      <option value="放疗四科">放疗四科</option>
      <option value="放疗五科">放疗五科</option>
    </select>
    <input placeholder="患者姓名" id="pName">
    <select id="pPos">
      <option value="仰卧">仰卧</option>
      <option value="俯卧">俯卧</option>
    </select>
    <select id="pMold">
      <option value="头模">头模</option>
      <option value="体膜">体膜</option>
    </select>
    <select id="pBeam">
      <option value="光子">光子</option>
      <option value="重离子">重离子</option>
    </select>
    <button onclick="addPatient()">新增患者</button>
  </div>
  <div class="card">
    <h3>待技师确认执行</h3>
    <div id="patientListTech"></div>
  </div>
</div>

<script>
const API_BASE = "";
let currentDept = "放疗一科";

// 切换标签
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const tab = t.dataset.tab;
  document.getElementById('tab-doctor').style.display = tab==='doctor'?'block':'none';
  document.getElementById('tab-tech').style.display = tab==='tech'?'block':'none';
  loadPatients();
})
document.getElementById('deptSelect').onchange = e=>{
  currentDept = e.target.value;
  loadPatients();
}

// 加载患者列表
async function loadPatients(){
  const res = await fetch(`${API_BASE}/api/getPatients`);
  const data = await res.json();
  const list = data.list.filter(p=>p.dept===currentDept && p.status==="pending");

  const wrapD = document.getElementById('patientListDoctor');
  wrapD.innerHTML = "";
  list.forEach(p=>{
    const div = document.createElement('div');
    div.className = "item";
    div.innerHTML = `
      <div class="checkbox" data-id="${p.id}"></div>
      <div class="info">
        <div>${p.name}</div>
        <div class="label">${p.pos}｜${p.mold}｜${p.beam}</div>
      </div>
    `
    const ck = div.querySelector('.checkbox');
    ck.onclick = async ()=>{
      const pid = ck.dataset.id;
      await fetch(`${API_BASE}/api/confirmDoctor`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:pid})
      })
      loadPatients();
    }
    wrapD.appendChild(div);
  })

  // 技师列表
  const wrapT = document.getElementById('patientListTech');
  wrapT.innerHTML = "";
  const techList = data.list.filter(p=>p.dept===document.getElementById('techDept').value && p.status==="doctorConfirm");
  techList.forEach(p=>{
    const div = document.createElement('div');
    div.className = "item";
    div.innerHTML = `
      <div class="info">
        <div>${p.name}</div>
        <div class="label">${p.pos}｜${p.mold}｜${p.beam}</div>
      </div>
      <button onclick="techDone('${p.id}')">确认执行归档</button>
    `
    wrapT.appendChild(div);
  })
}

async function addPatient(){
  const payload = {
    dept:document.getElementById('techDept').value,
    name:document.getElementById('pName').value,
    pos:document.getElementById('pPos').value,
    mold:document.getElementById('pMold').value,
    beam:document.getElementById('pBeam').value
  }
  await fetch(`${API_BASE}/api/getPatients`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  })
  loadPatients();
}
async function techDone(id){
  await fetch(`${API_BASE}/api/techFinish`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  })
  loadPatients();
}
loadPatients();
</script>
</body>
</html>
